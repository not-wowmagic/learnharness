# Local/production single-instance stack.
#
#   cp docs/hosted-web.md -> .env.hosted   # fill the runtime env
#   docker compose up -d --build
#
# Public NEXT_PUBLIC_* values are build args (inlined into the client);
# secrets belong in .env.hosted (runtime).

services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_LH_HOSTED: "1"
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-}
    env_file:
      - .env.hosted
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
